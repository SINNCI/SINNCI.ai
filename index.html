<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINNCI AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #050505;
      background-size: 40px 40px;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.10), transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(0,255,136,.05), transparent 30%);
    }

    .container {
      max-width: 760px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin: 25px 0 22px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #151515, #080808);
      border: 1px solid rgba(212,175,55,.45);
      box-shadow: 0 0 35px rgba(212,175,55,.10);
      color: #d4af37;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .header h1 {
      margin-top: 14px;
      font-size: 38px;
      letter-spacing: 4px;
      font-weight: 900;
    }

    .header h1 span {
      color: #d4af37;
    }

    .header p {
      color: #777;
      margin-top: 7px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(15,15,15,.88);
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.025);
      backdrop-filter: blur(10px);
    }

    .live-box {
      text-align: center;
      padding: 28px 20px;
      border-color: rgba(212,175,55,.20);
    }

    .live-label {
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .price {
      font-size: 46px;
      font-weight: 900;
      margin: 10px 0;
      letter-spacing: 1px;
    }

    .status {
      display: inline-block;
      color: #00ff88;
      background: rgba(0,255,136,.06);
      border: 1px solid rgba(0,255,136,.15);
      padding: 7px 12px;
      border-radius: 50px;
      font-size: 11px;
      letter-spacing: .5px;
    }

    label {
      display: block;
      color: #999;
      margin-bottom: 8px;
      font-size: 13px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: #111;
      border: 1px solid #303030;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,.08);
    }

    button {
      width: 100%;
      padding: 16px;
      border: 1px solid #d4af37;
      border-radius: 12px;
      background: linear-gradient(135deg, #f1d477, #b88a16);
      color: #080808;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(212,175,55,.18);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result {
      margin-top: 22px;
      display: none;
    }

    .signal {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .directions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .tf {
      background: #111;
      border: 1px solid #252525;
      padding: 13px 5px;
      border-radius: 12px;
      text-align: center;
    }

    .tf span {
      display: block;
      color: #666;
      font-size: 10px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .tf strong {
      font-size: 11px;
    }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .level {
      background: #111;
      border: 1px solid #252525;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .level span {
      display: block;
      color: #666;
      font-size: 10px;
      margin-bottom: 7px;
      letter-spacing: 1px;
    }

    .level strong {
      font-size: 19px;
    }

    .extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .extra-box {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }

    .extra-box span {
      display: block;
      color: #666;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .extra-box strong {
      font-size: 13px;
    }

    .message {
      text-align: center;
      color: #999;
      margin-top: 16px;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #444;
      font-size: 11px;
      margin: 28px 0 10px;
      letter-spacing: 1px;
    }

    @media(max-width:500px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 31px;
      }

      .price {
        font-size: 38px;
      }

      .directions {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">SAI</div>
      <h1>SINNCI <span>AI</span></h1>
      <p>AI TRADING ANALYSIS SYSTEM</p>
    </div>

    <!-- LIVE PRICE -->
    <div class="card live-box">

      <div class="live-label">
        XAUUSD LIVE PRICE
      </div>

      <div class="price" id="livePrice">
        Loading...
      </div>

      <div class="status" id="status">
        Connecting...
      </div>

    </div>

    <!-- ANALYSIS -->
    <div class="card">

      <label>Trading Pair</label>

      <select id="pair">
        <option value="XAUUSD">XAUUSD</option>
      </select>

      <label>Timeframe</label>

      <select id="timeframe">
        <option value="M5">M5</option>
        <option value="M15">M15</option>
        <option value="M30">M30</option>
        <option value="H1">H1</option>
        <option value="H4">H4</option>
      </select>

      <label>Current Price</label>

      <input
        type="number"
        id="currentPrice"
        placeholder="Current XAUUSD price"
        step="0.01"
      >

      <button id="analyzeButton" onclick="analyzeMarket()">
        ANALYZE MARKET
      </button>

      <!-- RESULT -->
      <div class="result" id="result">

        <div class="signal" id="signal">
          WAIT
        </div>

        <!-- TIMEFRAME -->
        <div class="directions">

          <div class="tf">
            <span>H4</span>
            <strong id="h4">-</strong>
          </div>

          <div class="tf">
            <span>H1</span>
            <strong id="h1">-</strong>
          </div>

          <div class="tf">
            <span>M30</span>
            <strong id="m30">-</strong>
          </div>

          <div class="tf">
            <span>M15</span>
            <strong id="m15">-</strong>
          </div>

          <div class="tf">
            <span>M5</span>
            <strong id="m5">-</strong>
          </div>

        </div>

        <!-- LEVELS -->
        <div class="levels">

          <div class="level">
            <span>ENTRY</span>
            <strong id="entry">-</strong>
          </div>

          <div class="level">
            <span>STOP LOSS</span>
            <strong id="sl">-</strong>
          </div>

          <div class="level">
            <span>TP 1</span>
            <strong id="tp1">-</strong>
          </div>

          <div class="level">
            <span>TP 2</span>
            <strong id="tp2">-</strong>
          </div>

        </div>

        <!-- EXTRA AI DATA -->
        <div class="extra">

          <div class="extra-box">
            <span>PUNCA</span>
            <strong id="punca">-</strong>
          </div>

          <div class="extra-box">
            <span>RISK</span>
            <strong id="risk">-</strong>
          </div>

        </div>

        <div class="message" id="message">
          SINNCI AI Technical Analysis
        </div>

      </div>

    </div>

    <div class="footer">
      SINNCI.BigMovement © 2026
    </div>

  </div>


  <script>

    let analyzeCooldown = false;
    let cooldownSeconds = 60;


    // ==============================
    // LIVE PRICE
    // ==============================

    async function getLivePrice() {

      try {

        const response = await fetch("/api/price");

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(
            data.error || "Unable to get XAUUSD price"
          );
        }

        const price = Number(data.price);

        if (!Number.isFinite(price)) {
          throw new Error("Invalid price received");
        }

        document.getElementById("livePrice")
          .textContent = price.toFixed(2);

        document.getElementById("currentPrice")
          .value = price.toFixed(2);

        document.getElementById("status")
          .textContent = "● LIVE • Updated just now";

      }

      catch(error) {

        document.getElementById("livePrice")
          .textContent = "Unavailable";

        document.getElementById("status")
          .textContent = "API: " + error.message;

      }

    }


    // ==============================
    // ANALYZE MARKET
    // ==============================

    async function analyzeMarket() {

      if (analyzeCooldown) {
        return;
      }

      const button =
        document.getElementById("analyzeButton");

      analyzeCooldown = true;

      button.disabled = true;

      let remaining = cooldownSeconds;

      button.textContent =
        "ANALYZING...";

      try {

        const response =
          await fetch("/api/analyze");

        const data =
          await response.json();

        if (!response.ok || data.error) {

          throw new Error(
            data.error || "Analysis failed"
          );

        }


        // SIGNAL

        const signal =
          data.signal || "WAIT";

        const signalElement =
          document.getElementById("signal");

        signalElement.textContent =
          signal;


        // SIGNAL COLOR

        if (signal === "BUY") {

          signalElement.style.color =
            "#00ff88";

        }

        else if (signal === "SELL") {

          signalElement.style.color =
            "#ff4d4d";

        }

        else {

          signalElement.style.color =
            "#d4af37";

        }


        // DIRECTIONS

        document.getElementById("h4")
          .textContent =
          data.direction?.H4 || "-";

        document.getElementById("h1")
          .textContent =
          data.direction?.H1 || "-";

        document.getElementById("m30")
          .textContent =
          data.direction?.M30 || "-";

        document.getElementById("m15")
          .textContent =
          data.direction?.M15 || "-";

        document.getElementById("m5")
          .textContent =
          data.direction?.M5 || "-";


        // LEVELS

        document.getElementById("entry")
          .textContent =
          data.entry !== null &&
          data.entry !== undefined
            ? Number(data.entry).toFixed(2)
            : "-";

        document.getElementById("sl")
          .textContent =
          data.sl !== null &&
          data.sl !== undefined
            ? Number(data.sl).toFixed(2)
            : "-";

        document.getElementById("tp1")
          .textContent =
          data.tp1 !== null &&
          data.tp1 !== undefined
            ? Number(data.tp1).toFixed(2)
            : "-";

        document.getElementById("tp2")
          .textContent =
          data.tp2 !== null &&
          data.tp2 !== undefined
            ? Number(data.tp2).toFixed(2)
            : "-";


        // PUNCA

        if (data.punca) {

          const source =
            data.punca.source || "-";

          const price =
            data.punca.price !== undefined
              ? Number(data.punca.price).toFixed(2)
              : "";

          document.getElementById("punca")
            .textContent =
            price
              ? source + " • " + price
              : source;

        }

        else {

          document.getElementById("punca")
            .textContent = "-";

        }


        // RISK

        if (data.risk !== undefined) {

          document.getElementById("risk")
            .textContent =
            Number(data.risk).toFixed(2);

        }

        else {

          document.getElementById("risk")
            .textContent = "-";

        }


        // MESSAGE

        document.getElementById("message")
          .textContent =
          data.status ||
          "SINNCI AI Technical Analysis";


        document.getElementById("result")
          .style.display = "block";


        // START COOLDOWN

        button.textContent =
          "NEXT ANALYSIS: 60s";

        const timer =
          setInterval(() => {

            remaining--;

            button.textContent =
              "NEXT ANALYSIS: " +
              remaining +
              "s";

            if (remaining <= 0) {

              clearInterval(timer);

              analyzeCooldown = false;

              button.disabled = false;

              button.textContent =
                "ANALYZE MARKET";

            }

          }, 1000);


      }

      catch(error) {

        document.getElementById("message")
          .textContent =
          "Analysis error: " +
          error.message;

        document.getElementById("result")
          .style.display = "block";


        // Release button after error

        setTimeout(() => {

          analyzeCooldown = false;

          button.disabled = false;

          button.textContent =
            "ANALYZE MARKET";

        }, 3000);

      }

    }


    // ==============================
    // INITIAL PRICE
    // ==============================

    getLivePrice();


    // ==============================
    // UPDATE EVERY 60 SECONDS
    // ==============================

    setInterval(
      getLivePrice,
      60000
    );

  </script>

</body>
</html>
