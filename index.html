<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINNCI AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin: 30px 0;
    }

    .header h1 {
      font-size: 38px;
      letter-spacing: 3px;
    }

    .header p {
      color: #888;
      margin-top: 8px;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .live-box {
      text-align: center;
      padding: 25px;
    }

    .live-label {
      color: #aaa;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      color: #00ff88;
      font-size: 13px;
    }

    label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      display: none;
    }

    .signal {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .directions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .tf {
      background: #1a1a1a;
      padding: 12px 5px;
      border-radius: 10px;
      text-align: center;
    }

    .tf span {
      display: block;
      color: #777;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .tf strong {
      font-size: 11px;
    }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .level {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .level span {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .level strong {
      font-size: 18px;
    }

    .message {
      text-align: center;
      color: #aaa;
      margin-top: 15px;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 30px;
    }

    @media (max-width: 500px) {
      .directions {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>SINNCI AI</h1>
      <p>AI Trading Analysis System</p>
    </div>

    <!-- LIVE PRICE -->

    <div class="card live-box">

      <div class="live-label">
        XAUUSD LIVE PRICE
      </div>

      <div class="price" id="livePrice">
        Loading...
      </div>

      <div class="status" id="status">
        Connecting...
      </div>

    </div>


    <!-- MARKET ANALYSIS -->

    <div class="card">

      <label>Trading Pair</label>

      <select id="pair">
        <option value="XAUUSD">XAUUSD</option>
      </select>


      <label>Timeframe</label>

      <select id="timeframe">
        <option value="M5">M5</option>
        <option value="M15">M15</option>
        <option value="M30">M30</option>
        <option value="H1">H1</option>
        <option value="H4">H4</option>
      </select>


      <label>Current Price</label>

      <input
        type="number"
        id="currentPrice"
        placeholder="Current XAUUSD price"
        step="0.01"
      >


      <button onclick="analyzeMarket()">
        ANALYZE MARKET
      </button>


      <div class="result" id="result">

        <div class="signal" id="signal">
          WAIT
        </div>


        <!-- TIMEFRAME DIRECTION -->

        <div class="directions">

          <div class="tf">
            <span>H4</span>
            <strong id="h4">-</strong>
          </div>

          <div class="tf">
            <span>H1</span>
            <strong id="h1">-</strong>
          </div>

          <div class="tf">
            <span>M30</span>
            <strong id="m30">-</strong>
          </div>

          <div class="tf">
            <span>M15</span>
            <strong id="m15">-</strong>
          </div>

          <div class="tf">
            <span>M5</span>
            <strong id="m5">-</strong>
          </div>

        </div>


        <!-- ENTRY / SL / TP -->

        <div class="levels">

          <div class="level">
            <span>ENTRY</span>
            <strong id="entry">-</strong>
          </div>

          <div class="level">
            <span>STOP LOSS</span>
            <strong id="sl">-</strong>
          </div>

          <div class="level">
            <span>TP 1</span>
            <strong id="tp1">-</strong>
          </div>

          <div class="level">
            <span>TP 2</span>
            <strong id="tp2">-</strong>
          </div>

        </div>


        <div class="message" id="message">
          SINNCI AI Technical Analysis
        </div>

      </div>

    </div>


    <div class="footer">
      SINNCI.BigMovement © 2026
    </div>

  </div>


  <script>

    // =========================
    // LIVE XAUUSD PRICE
    // =========================

    async function getLivePrice() {

      try {

        const response = await fetch("/api/price");

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const price = Number(data.price);

        document.getElementById("livePrice").textContent =
          price.toFixed(2);

        document.getElementById("currentPrice").value =
          price.toFixed(2);

        document.getElementById("status").textContent =
          "● LIVE • Updated just now";

      } catch (error) {

        document.getElementById("livePrice").textContent =
          "Unavailable";

        document.getElementById("status").textContent =
          "Connection error";

      }

    }


    // =========================
    // SINNCI AI ANALYSIS
    // =========================

    async function analyzeMarket() {

      const button =
        document.querySelector("button");

      button.textContent = "ANALYZING...";

      button.disabled = true;

      try {

        const response =
          await fetch("/api/analyze");

        const data =
          await response.json();

        if (data.error) {
          throw new Error(data.error);
        }


        // SIGNAL

        document.getElementById("signal").textContent =
          data.signal;


        // TIMEFRAME DIRECTION

        document.getElementById("h4").textContent =
          data.direction.H4;

        document.getElementById("h1").textContent =
          data.direction.H1;

        document.getElementById("m30").textContent =
          data.direction.M30;

        document.getElementById("m15").textContent =
          data.direction.M15;

        document.getElementById("m5").textContent =
          data.direction.M5;


        // LEVELS

        document.getElementById("entry").textContent =
          data.entry
            ? Number(data.entry).toFixed(2)
            : "-";

        document.getElementById("sl").textContent =
          data.sl
            ? Number(data.sl).toFixed(2)
            : "-";

        document.getElementById("tp1").textContent =
          data.tp1
            ? Number(data.tp1).toFixed(2)
            : "-";

        document.getElementById("tp2").textContent =
          data.tp2
            ? Number(data.tp2).toFixed(2)
            : "-";


        document.getElementById("message").textContent =
          "SINNCI AI Technical Analysis";


        document.getElementById("result").style.display =
          "block";


      } catch (error) {

        document.getElementById("message").textContent =
          "Analysis error: " + error.message;

        document.getElementById("result").style.display =
          "block";

      }


      button.textContent =
        "ANALYZE MARKET";

      button.disabled =
        false;

    }


    // LOAD LIVE PRICE

    getLivePrice();


    // UPDATE EVERY 5 SECONDS

    setInterval(getLivePrice, 5000);

  </script>

</body>
</html>
